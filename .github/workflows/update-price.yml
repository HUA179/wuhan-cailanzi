name: 每日更新武汉菜价

# ---------------------------------------------------------------
# 定时抓取已迁到腾讯云 SCF：
#   函数 cailanzi-full（广州），每天北京时间 07:00 跑 full_fetch()
#   跑完直接回写 data.json，同时覆盖 52 周历史
#
# 这里不再保留 schedule —— 两套定时同时提交 data.json 会互相顶掉，
# 白白产生一次 422 重试。Actions 现在只作为「手动兜底」保留：
# 在网页上点 Run workflow 手动跑一次（可选 daily / full）。
# ---------------------------------------------------------------
on:
  # schedule:
  #   # GitHub 用 UTC 时间：北京时间 06:00 = UTC 前一天 22:00
  #   - cron: '0 22 * * *'
  workflow_dispatch:  # 仅手动触发
    inputs:
      mode:
        description: '抓取模式：daily 只追加今天（默认）；full 重爬 52 周历史'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - full

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 pypinyin

      # 注意：GitHub 的 runner 在境外，发改委是裸 IP:7600 出境不可达，
      # 所以这里即使选 full 也拿不到 52 周历史（会保留旧数据，不会写坏）。
      # 真要重爬历史，用 scf 或本机跑 fetch_data.py --mode=full。
      - name: 追加今日菜价
        timeout-minutes: 8
        run: python fetch_data.py --mode=${{ github.event.inputs.mode || 'daily' }}

      - name: 提交并推送 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore: 更新菜价数据 $(date +'%Y-%m-%d')"
            git push
          fi
