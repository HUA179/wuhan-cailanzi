name: 每日更新武汉菜价

on:
  schedule:
    # GitHub 用 UTC 时间：北京时间 06:00 = UTC 前一天 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install requests beautifulsoup4 pypinyin
      - name: 抓取最新菜价
        run: python fetch_data.py
      - name: 提交并推送 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore: 更新菜价数据 $(date +'%Y-%m-%d')"
            git push
          fi
