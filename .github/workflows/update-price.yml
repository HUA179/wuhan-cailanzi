name: 每日更新武汉菜价

on:
  schedule:
    # GitHub 用 UTC 时间：北京时间 06:00 = UTC 前一天 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      mode:
        description: '抓取模式：daily 只追加今天（默认）；full 重爬 52 周历史'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - full

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 pypinyin

      # 动静分离：52 周历史是死数据，只在本地用 --mode=full 抓。
      # 云端每天只抓「今天」这一个截面，请求数个位数，几秒跑完，杜绝超时。
      # 发改委是裸 IP:7600，境外 ConnectTimeout 属常态，脚本会自动跳过并保留旧数据。
      - name: 追加今日菜价
        timeout-minutes: 8
        run: python fetch_data.py --mode=${{ github.event.inputs.mode || 'daily' }}

      - name: 提交并推送 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore: 更新菜价数据 $(date +'%Y-%m-%d')"
            git push
          fi
