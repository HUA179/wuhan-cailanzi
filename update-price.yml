# =========================================================
# 武汉菜篮子 - 每日自动更新菜价
# 每天北京时间 06:00 自动抓取武汉市农业农村局最新菜价，
# 并把生成的 data.json 自动提交回仓库（GitHub Pages 随即自动更新）
# =========================================================
name: 每日更新武汉菜价

on:
  schedule:
    # GitHub Actions 使用 UTC 时间！
    # 北京时间 06:00 = UTC 前一天 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许在 Actions 页面手动点按钮触发（调试用）

permissions:
  contents: write  # 允许 Action 把 data.json 推送回仓库

jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码（fetch_data.py 就在仓库里）
      - name: 检出仓库
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 安装爬虫依赖
      - name: 安装依赖
        run: pip install requests beautifulsoup4 pypinyin

      # 4. 运行爬虫，生成最新 data.json
      - name: 抓取最新菜价
        run: python fetch_data.py

      # 5. 提交并推送（数据没变化时自动跳过）
      - name: 提交并推送 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "今日数据无变化，跳过提交"
          else
            git commit -m "chore: 更新菜价数据 $(date +'%Y-%m-%d')"
            git push
          fi
